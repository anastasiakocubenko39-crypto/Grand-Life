<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Гранд Лайф — агентство нерухомості у Києві та області</title>
<meta name="description" content="Квартири, будинки, земельні ділянки, оренда і комерційна нерухомість у Києві та Київській області. Юридичний супровід угоди з 2017 року.">
<meta property="og:title" content="Гранд Лайф — агентство нерухомості у Києві та області">
<meta property="og:description" content="Квартири, будинки, земельні ділянки, оренда і комерційна нерухомість у Києві та Київській області. Юридичний супровід угоди з 2017 року.">
<meta property="og:image" content="assets/img/hero.webp">
<link rel="icon" href="assets/brand/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=20261136">
<link rel="stylesheet" href="assets/app.css?v=20261136">
<script src="config.js?v=20261136"></script>
</head>
<body>
<main>
  <section class="hero">
    <div class="hero-bg"><img id="heroImg" alt=""></div>
    <div class="wrap">
      <span class="kicker rv" id="heroKicker"></span>
      <h1 class="h1 rv" style="--d:.1s" id="heroTitle"></h1>
      <p class="lead rv" style="--d:.2s" id="heroLead"></p>
      <div class="hero-stats rv" style="--d:.3s" id="heroStats"></div>
      <form class="qsearch rv" style="--d:.4s" action="catalog.html">
        <label><span>Тип</span><select name="type" id="qType"><option value="">Усі об’єкти</option></select></label>
        <label><span>Локація</span><input name="q" placeholder="Місто, район, вулиця"></label>
        <label><span class="lbl-row">Бюджет до,<select name="cur" class="cur" aria-label="Валюта"><option value="$">$</option><option value="₴">₴</option></select></span><input name="max" inputmode="numeric" placeholder="Будь-який"></label>
        <button class="btn" type="submit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Шукати</button>
      </form>
    </div>
  </section>

  <section class="sec">
    <div class="wrap">
      <div class="sec-head"><div><span class="kicker rv">Категорії</span><h2 class="h2 rv">Що ви <em>шукаєте?</em></h2></div><a class="link rv" href="catalog.html">Усі об’єкти</a></div>
      <div class="cats" id="cats"></div>
    </div>
  </section>

  <section class="sec tint">
    <div class="wrap">
      <div class="sec-head"><div><span class="kicker rv">Пропозиції</span><h2 class="h2 rv">Актуальні <em>об’єкти</em></h2></div><a class="btn line rv" href="catalog.html">Переглянути каталог</a></div>
      <div class="grid" id="latest"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
    </div>
  </section>

  <section class="sec dark">
    <div class="wrap">
      <div class="sec-head"><div><span class="kicker rv">Переваги</span><h2 class="h2 rv" id="whyTitle"></h2></div><p class="lead rv">Беремо на себе пошук, перевірку і всю бюрократію — вам лишається вибрати.</p></div>
      <div class="feats rv" id="feats"></div>
    </div>
  </section>

  <section class="sec">
    <div class="wrap split">
      <div class="split-img rv-img"><img id="aboutImg" alt="" loading="lazy"><div class="float rv" style="--d:.4s"><b id="aboutYears"></b><span id="aboutYearsText"></span></div></div>
      <div>
        <span class="kicker rv">Про компанію</span>
        <h2 class="h2 rv" style="margin-top:14px" id="aboutTitle"></h2>
        <p class="lead rv" id="aboutLead" style="margin-top:18px"></p>
        <ul class="checks" id="aboutChecks"></ul>
        <a class="btn dark rv" href="about.html">Більше про нас <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg></a>
      </div>
    </div>
  </section>

  <section class="sec tint">
    <div class="wrap">
      <div class="sec-head"><div><span class="kicker rv">Як ми працюємо</span><h2 class="h2 rv">Від заявки <em>до ключів</em></h2></div></div>
      <div class="steps" id="steps"></div>
    </div>
  </section>

  <section class="sec" id="contacts" style="padding-bottom:0">
    <div class="wrap">
      <div class="cta rv">
        <div><span class="kicker">Контакти</span><h2 class="h2" style="margin:16px 0" id="ctaTitle">Готові <em>допомогти</em></h2><p id="ctaText"></p></div>
        <div class="cta-actions"><div class="contact-list" id="contactList"></div></div>
      </div>
    </div>
  </section>
</main>
<script type="module">
import { S, PUBLIC_TYPES as TYPES, TYPE, I, esc, store, cardHTML, layout, reveal, telHref, $ } from './assets/core.js?v=20261136';
layout({ page: 'home', overDark: true });
$('#heroImg').src = S.heroImage;
$('#heroKicker').textContent = S.heroKicker;
$('#heroTitle').innerHTML = S.heroTitle;
$('#heroLead').textContent = S.heroLead;
$('#heroStats').innerHTML = S.stats.map(([b, t]) => `<div><b>${esc(b)}</b><span>${esc(t)}</span></div>`).join('');
$('#qType').insertAdjacentHTML('beforeend', TYPES.map((t) => `<option value="${t.id}">${t.label}</option>`).join(''));
$('#whyTitle').innerHTML = S.whyTitle;
$('#feats').innerHTML = S.why.map(([ic, h, p]) => `<div class="feat"><div class="ic">${I[ic]}</div><h4>${esc(h)}</h4><p>${esc(p)}</p></div>`).join('');
$('#aboutImg').src = S.aboutImage;
$('#aboutYears').textContent = S.aboutBadge[0]; $('#aboutYearsText').textContent = S.aboutBadge[1];
$('#aboutTitle').innerHTML = S.aboutTitle; $('#aboutLead').textContent = S.aboutLead;
$('#aboutChecks').innerHTML = S.aboutChecks.map(([b, s], i) => `<li class="rv" style="--d:${i * .06}s">${I.check}<div><b>${esc(b)}</b><span>${esc(s)}</span></div></li>`).join('');
$('#steps').innerHTML = S.steps.map(([h, p], i) => `<div class="step rv" style="--d:${i * .08}s"><h4>${esc(h)}</h4><p>${esc(p)}</p></div>`).join('');
$('#ctaText').textContent = S.ctaText;
$('#contactList').innerHTML = [
  ...(S.phones || []).map((p) => `<a href="${telHref(p)}">${I.phone}${esc(p)}</a>`),
  S.email && `<a href="mailto:${esc(S.email)}">${I.mail}${esc(S.email)}</a>`,
  S.instagram && `<a href="https://instagram.com/${esc(S.instagram)}" target="_blank" rel="noopener">${I.insta}@${esc(S.instagram)}</a>`,
  S.telegram && `<a href="${esc(S.telegram)}" target="_blank" rel="noopener">${I.tg}Telegram</a>`,
  `<a>${I.pin}${esc(S.region)}</a>`,
].filter(Boolean).join('') + `<a class="btn" href="catalog.html" style="margin-top:14px;justify-content:center">Переглянути об’єкти</a>`;

let all = [];
try { all = (await store.all()).filter((p) => !TYPE[p.type]?.hidden); } catch (e) { console.error(e); }
$('#cats').innerHTML = TYPES.filter((t) => t.img).map((t, i) => {
  const n = all.filter((p) => p.type === t.id && !p.sold).length;
  return `<a class="cat rv" style="--d:${i * .07}s" href="catalog.html?type=${encodeURIComponent(t.id)}"><img src="${t.img}" alt="" loading="lazy">${n ? `<i>${n} в наявності</i>` : ''}<b>${t.label}</b><span>${t.note}</span></a>`;
}).join('');
const latest = all.filter((p) => !p.sold).sort((a, b) => (b.featured - a.featured) || ((b.date || 0) - (a.date || 0))).slice(0, 6);
$('#latest').innerHTML = latest.length ? latest.map(cardHTML).join('') : '<div class="empty"><b>Нові об’єкти скоро</b>Зателефонуйте нам — підберемо варіанти, яких ще немає на сайті.</div>';
reveal();
</script>
</body>
</html>
