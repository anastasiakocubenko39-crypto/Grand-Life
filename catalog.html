<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Каталог об’єктів — Гранд Лайф</title>
<meta name="description" content="Будинки, квартири, ділянки, оренда і комерційна нерухомість. Зручні фільтри за ціною, площею, кількістю кімнат і локацією.">
<link rel="icon" href="assets/brand/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=20261129">
<link rel="stylesheet" href="assets/app.css?v=20261129">
<script src="config.js?v=20261129"></script>
</head>
<body>
<main>
  <section class="phead">
    <div class="wrap">
      <div class="crumbs"><a href="index.html">Головна</a><span>/</span><span id="crumb">Каталог</span></div>
      <h1 class="h1" id="pageTitle">Каталог <em>об’єктів</em></h1>
    </div>
  </section>
  <div class="wrap cat-layout">
    <aside class="filters" id="filters" aria-label="Фільтри">
      <h3>Фільтри <button type="button" id="reset">Скинути</button></h3>
      <div class="fgroup"><span>Тип об’єкта</span><div class="chips" id="fType"></div></div>
      <div class="fgroup"><span>Пошук</span><input class="field" id="fQ" placeholder="Назва, місто, район"></div>
      <div class="fgroup"><span>Локація</span><select class="field" id="fLoc"><option value="">Усі локації</option></select></div>
      <div class="fgroup"><span>Ціна<span class="cur-switch" id="fCur"><button type="button" data-v="$">$</button><button type="button" data-v="₴">₴</button></span></span><div class="range"><input class="field" id="fMin" inputmode="numeric" placeholder="від"><input class="field" id="fMax" inputmode="numeric" placeholder="до"></div></div>
      <div class="fgroup"><span>Площа, м²</span><div class="range"><input class="field" id="fAMin" inputmode="numeric" placeholder="від"><input class="field" id="fAMax" inputmode="numeric" placeholder="до"></div></div>
      <div class="fgroup" id="roomsGroup"><span>Кімнат</span><div class="chips" id="fRooms"></div></div>
      <div class="fgroup"><span>Стан</span><select class="field" id="fCond"><option value="">Будь-який</option></select></div>
      <div class="fgroup"><span>Особливості</span><div class="chips" id="fFeat"></div></div>
      <div class="fgroup"><label class="check"><input type="checkbox" id="fPhoto"> Лише з фото</label><label class="check" style="margin-top:10px"><input type="checkbox" id="fSold"> Показати продані</label></div>
      <button class="btn block apply" type="button" id="apply">Показати</button>
    </aside>
    <section>
      <div class="toolbar">
        <div class="count" id="count">Завантаження…</div>
        <div class="toolbar-r">
          <button class="btn line sm filters-open" type="button" id="openF"></button>
          <select class="field" id="sort" aria-label="Сортування">
            <option value="new">Спочатку нові</option><option value="cheap">Спочатку дешевші</option><option value="exp">Спочатку дорожчі</option><option value="area">За площею</option>
          </select>
          <button class="viewbtn" id="vGrid" aria-pressed="true" aria-label="Плиткою"></button>
          <button class="viewbtn" id="vList" aria-pressed="false" aria-label="Списком"></button>
        </div>
      </div>
      <div class="active-tags" id="tags"></div>
      <div class="grid" id="grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
    </section>
  </div>
</main>
<script type="module">
import { S, PUBLIC_TYPES as TYPES, TYPE, CONDITIONS, I, esc, store, cardHTML, layout, reveal, $, $$ } from './assets/core.js?v=20261129';
layout({ page: 'catalog' });
$('#openF').innerHTML = I.filter + 'Фільтри'; $('#vGrid').innerHTML = I.grid; $('#vList').innerHTML = I.list;
const QUICK = ['Можлива іпотека', 'Можлива розстрочка', 'Укриття', 'Генератор / автономність', 'Паркінг', 'Тераса', 'Меблі', 'Можна з тваринами'];
const params = new URLSearchParams(location.search);
const st = {
  type: params.get('type') || '', q: params.get('q') || '', loc: params.get('loc') || '',
  cur: params.get('cur') === '₴' ? '₴' : '$', min: params.get('min') || '', max: params.get('max') || '', amin: params.get('amin') || '', amax: params.get('amax') || '',
  rooms: params.get('rooms') || '', cond: params.get('cond') || '', feat: (params.get('feat') || '').split('|').filter(Boolean),
  photo: params.get('photo') === '1', sold: params.get('sold') === '1', sort: params.get('sort') || 'new', view: localStorage.getItem('view') || 'grid',
};
let ALL = [];

$('#fType').innerHTML = [['', 'Усі'], ...TYPES.map((t) => [t.id, t.label])].map(([v, l]) => `<button type="button" class="chip" data-v="${v}">${l}</button>`).join('');
$('#fRooms').innerHTML = [['', 'Будь-яка'], ['1', '1'], ['2', '2'], ['3', '3'], ['4', '4+']].map(([v, l]) => `<button type="button" class="chip" data-v="${v}">${l}</button>`).join('');
$('#fCond').insertAdjacentHTML('beforeend', CONDITIONS.map((c) => `<option>${c}</option>`).join(''));
$('#fFeat').innerHTML = QUICK.map((f) => `<button type="button" class="chip" data-v="${f}">${f}</button>`).join('');

function syncUI() {
  $$('#fType .chip').forEach((c) => c.setAttribute('aria-pressed', c.dataset.v === st.type));
  $$('#fRooms .chip').forEach((c) => c.setAttribute('aria-pressed', c.dataset.v === st.rooms));
  $$('#fFeat .chip').forEach((c) => c.setAttribute('aria-pressed', st.feat.includes(c.dataset.v)));
  $$('#fCur button').forEach((c) => c.setAttribute('aria-pressed', c.dataset.v === st.cur));
  $('#fQ').value = st.q; $('#fLoc').value = st.loc; $('#fMin').value = st.min; $('#fMax').value = st.max; $('#fAMin').value = st.amin; $('#fAMax').value = st.amax;
  $('#fCond').value = st.cond; $('#fPhoto').checked = st.photo; $('#fSold').checked = st.sold; $('#sort').value = st.sort;
  $('#roomsGroup').hidden = st.type === 'Ділянка';
  $('#vGrid').setAttribute('aria-pressed', st.view === 'grid'); $('#vList').setAttribute('aria-pressed', st.view === 'list');
  const t = TYPE[st.type];
  $('#pageTitle').innerHTML = t ? `${esc(t.label)} <em>${t.id === 'Оренда' ? 'в оренду' : 'на продаж'}</em>` : 'Каталог <em>об’єктів</em>';
  $('#crumb').textContent = t ? t.label : 'Каталог';
  document.title = `${t ? t.label : 'Каталог об’єктів'} — ${S.name}`;
}
const n = (v) => (v === '' ? null : parseFloat(String(v).replace(/\s/g, '')));
function apply() {
  const q = st.q.trim().toLowerCase();
  let l = ALL.filter((p) => (st.sold || !p.sold)
    && (!st.type || p.type === st.type)
    && (!q || `${p.title} ${p.location} ${p.address || ''} ${p.description || ''}`.toLowerCase().includes(q))
    && (!st.loc || p.location === st.loc)
    && (n(st.min) == null || (price(p) != null && price(p) >= n(st.min)))
    && (n(st.max) == null || (price(p) != null && price(p) <= n(st.max)))
    && (n(st.amin) == null || (p.areaValue != null && toM2(p) >= n(st.amin)))
    && (n(st.amax) == null || (p.areaValue != null && toM2(p) <= n(st.amax)))
    && (!st.rooms || (st.rooms === '4' ? p.roomsNum >= 4 : p.roomsNum === +st.rooms))
    && (!st.cond || p.condition === st.cond)
    && st.feat.every((f) => p.features.includes(f))
    && (!st.photo || p.images.length));
  const by = { new: (a, b) => (b.featured - a.featured) || ((b.date || 0) - (a.date || 0)), cheap: (a, b) => (a.usd ?? 1e15) - (b.usd ?? 1e15), exp: (a, b) => (b.usd ?? -1) - (a.usd ?? -1), area: (a, b) => (toM2(b) || 0) - (toM2(a) || 0) };
  l.sort(by[st.sort] || by.new);
  const grid = $('#grid');
  grid.classList.toggle('list', st.view === 'list');
  grid.innerHTML = l.length ? l.map(cardHTML).join('') : '<div class="empty"><b>Нічого не знайдено</b>Спробуйте змінити фільтри або <a href="#" id="reset2">скинути їх</a>. Також можемо підібрати об’єкт індивідуально — зателефонуйте нам.</div>';
  $('#reset2')?.addEventListener('click', (e) => { e.preventDefault(); reset(); });
  const word = (k) => (k % 10 === 1 && k % 100 !== 11 ? 'об’єкт' : [2, 3, 4].includes(k % 10) && ![12, 13, 14].includes(k % 100) ? 'об’єкти' : 'об’єктів');
  $('#count').innerHTML = `Знайдено <b>${l.length}</b> ${word(l.length)}`;
  const active = activeCount();
  $('#openF').innerHTML = I.filter + 'Фільтри' + (active ? ` · ${active}` : '');
  tags(); reveal(grid);
  const qs = new URLSearchParams();
  for (const k of ['type', 'q', 'loc', 'min', 'max', 'amin', 'amax', 'rooms', 'cond']) if (st[k]) qs.set(k, st[k]);
  if (st.cur !== '$' && (st.min || st.max)) qs.set('cur', st.cur);
  if (st.feat.length) qs.set('feat', st.feat.join('|')); if (st.photo) qs.set('photo', 1); if (st.sold) qs.set('sold', 1); if (st.sort !== 'new') qs.set('sort', st.sort);
  history.replaceState(null, '', location.pathname + (qs.toString() ? '?' + qs : ''));
}
const price = (p) => (st.cur === '₴' ? p.uah : p.usd); // ціни всіх об’єктів переводяться за курсом НБУ
const toM2 = (p) => (p.areaValue == null ? null : p.areaUnit === 'сот' ? p.areaValue * 100 : p.areaUnit === 'га' ? p.areaValue * 10000 : p.areaValue);
const activeCount = () => ['type', 'q', 'loc', 'min', 'max', 'amin', 'amax', 'rooms', 'cond'].filter((k) => st[k]).length + st.feat.length + (st.photo ? 1 : 0);
function tags() {
  const t = [];
  if (st.type) t.push(['type', TYPE[st.type]?.label]);
  if (st.q) t.push(['q', `«${st.q}»`]); if (st.loc) t.push(['loc', st.loc]);
  const money = (v) => (st.cur === '₴' ? `${v} ₴` : `$${v}`);
  if (st.min || st.max) t.push(['price', `${money(st.min || 0)} – ${st.max ? money(st.max) : '∞'}`]);
  if (st.amin || st.amax) t.push(['areaR', `${st.amin || 0} – ${st.amax || '∞'} м²`]);
  if (st.rooms) t.push(['rooms', `${st.rooms}${st.rooms === '4' ? '+' : ''} кімн.`]); if (st.cond) t.push(['cond', st.cond]);
  st.feat.forEach((f) => t.push(['feat:' + f, f])); if (st.photo) t.push(['photo', 'з фото']);
  $('#tags').innerHTML = t.map(([k, l]) => `<button data-k="${esc(k)}">${esc(l)} ×</button>`).join('');
}
$('#tags').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return; const k = b.dataset.k;
  if (k.startsWith('feat:')) st.feat = st.feat.filter((f) => f !== k.slice(5));
  else if (k === 'price') { st.min = st.max = ''; } else if (k === 'areaR') { st.amin = st.amax = ''; } else if (k === 'photo') st.photo = false; else st[k] = '';
  syncUI(); apply();
});
function reset() { Object.assign(st, { type: '', q: '', loc: '', min: '', max: '', amin: '', amax: '', rooms: '', cond: '', feat: [], photo: false, sold: false }); syncUI(); apply(); }
$('#reset').onclick = reset;
$('#fCur').onclick = (e) => { const c = e.target.closest('button'); if (!c) return; st.cur = c.dataset.v; syncUI(); apply(); };
$('#fType').onclick = (e) => { const c = e.target.closest('.chip'); if (!c) return; st.type = c.dataset.v; syncUI(); apply(); };
$('#fRooms').onclick = (e) => { const c = e.target.closest('.chip'); if (!c) return; st.rooms = c.dataset.v; syncUI(); apply(); };
$('#fFeat').onclick = (e) => { const c = e.target.closest('.chip'); if (!c) return; const v = c.dataset.v; st.feat = st.feat.includes(v) ? st.feat.filter((f) => f !== v) : [...st.feat, v]; syncUI(); apply(); };
let t;
const bind = (id, k) => $(id).addEventListener('input', (e) => {
  if (k !== 'q') e.target.value = e.target.value.replace(/[^\d]/g, '');
  st[k] = e.target.value; clearTimeout(t); t = setTimeout(apply, 220);
});
[['#fQ', 'q'], ['#fMin', 'min'], ['#fMax', 'max'], ['#fAMin', 'amin'], ['#fAMax', 'amax']].forEach(([i, k]) => bind(i, k));
$('#fLoc').onchange = (e) => { st.loc = e.target.value; apply(); };
$('#fCond').onchange = (e) => { st.cond = e.target.value; apply(); };
$('#fPhoto').onchange = (e) => { st.photo = e.target.checked; apply(); };
$('#fSold').onchange = (e) => { st.sold = e.target.checked; apply(); };
$('#sort').onchange = (e) => { st.sort = e.target.value; apply(); };
const setView = (v) => { st.view = v; try { localStorage.setItem('view', v); } catch {} syncUI(); apply(); };
$('#vGrid').onclick = () => setView('grid'); $('#vList').onclick = () => setView('list');
const F = $('#filters');
$('#openF').onclick = () => { F.classList.add('open'); document.body.style.overflow = 'hidden'; };
$('#apply').onclick = () => { F.classList.remove('open'); document.body.style.overflow = ''; scrollTo({ top: 0, behavior: 'smooth' }); };

syncUI();
try { ALL = (await store.all()).filter((p) => !TYPE[p.type]?.hidden || p.type === st.type); } catch (e) { console.error(e); $('#grid').innerHTML = '<div class="empty"><b>Не вдалося завантажити</b>Перевірте з’єднання та оновіть сторінку.</div>'; }
const locs = [...new Set(ALL.map((p) => p.location.trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'uk'));
$('#fLoc').insertAdjacentHTML('beforeend', locs.map((l) => `<option>${esc(l)}</option>`).join(''));
$('#fLoc').value = st.loc;
if (!$('#grid .empty')) apply();
</script>
</body>
</html>
